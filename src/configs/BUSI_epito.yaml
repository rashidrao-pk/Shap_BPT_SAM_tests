# Root must contain benign/, malignant/, normal/ and their *_mask*.png files.
device: cuda
data:
  name: BUSI
  input_format: directory
  image_dir: /beegfs/home/mrashid/datasets/BUSI
  mask_dir_final: BUSI_sam2_tiny_62_compact-sam_50
  ground_truth:
    format: busi
    root: /beegfs/home/mrashid/datasets/BUSI

evaluation:
  methods: [BPT, compact]
  limit: 2
  bg-type: "full"
  max-evals: 500
  eval-batch-size: 2048
  auc-batch-size: 1024
  auc_num_samples: 101

  # Options:
  #   black   : black background
  #   gray    : gray background
  #   white   : white background
  #   blurred : blurred background
  #  noise
output:
  partitions: /beegfs/home/mrashid/datasets/SAM_BPT
  explanations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/explanations
  evaluations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/evaluations
