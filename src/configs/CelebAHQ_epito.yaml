# Partition generation from CelebA-HQ images; annotations are not required.
device: cuda
data:
  name: CelebAHQ
  input_format: directory
  image_dir: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/data/data_full/CelebAMask-HQ/CelebAMask-HQ/CelebA-HQ-img
  # Preview input: match this to the folder produced by your generation command.
  mask_dir_final: CelebAHQ_sam1_vit_b_62_compact-sam_50
    
  # New SAM2 batch outputs; older partition directories are preserved.
  mask_dir_final_sam1: "MSCOCO_sam1_vit_b_62_compact-sam_200"
  mask_dir_final_sam2: "MSCOCO_sam2_tiny_62_compact-sam_200"
  
  ground_truth:
    format: celebamask_hq
    root: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/data/data_full/CelebAMask-HQ/CelebAMask-HQ-mask-anno

# Download once with python src/scripts/download_celeba_checkpoint.py
model:
  checkpoint: src/checkpoints/celeba_model.pth

evaluation:
  methods: [BPT, compact]
  limit: 2
  bg-type: "full"
  max-evals: 500
  eval-batch-size: 2048
  auc-batch-size: 1024
  auc_num_samples: 101

  # Options:
  #   black   : black background
  #   gray    : gray background
  #   white   : white background
  #   blurred : blurred background
  #  noise

output:
  partitions: /beegfs/home/mrashid/datasets/SAM_BPT
  explanations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/explanations
  evaluations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/evaluations
