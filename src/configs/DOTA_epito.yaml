# DOTA-v1.0 val tiles (1024x1024) prepared by download_datasets.py --dataset dota.
device: cuda
data:
  name: DOTA
  input_format: directory
  image_dir: /beegfs/home/mrashid/datasets/DOTA/prepared_1024/val/images
  mask_dir_final: DOTA_sam2_large_254_compact-sam_200
  # Compact file read by XAI, previews and the audit: split (<id>_compact_split.npy, default), greedy, mso_0.5, ...
  compact_strategy: split
  # Per-model folders: view_partitions.py --sam sam1 | sam2
  mask_dir_final_sam1: "DOTA_sam1_vit_b_254_compact-sam_200"
  mask_dir_final_sam2: "DOTA_sam2_large_254_compact-sam_200"
  ground_truth:
    format: dota
    root: /beegfs/home/mrashid/datasets/DOTA/prepared_1024/val/labels
model:
  checkpoint: src/checkpoints/yolo11s-obb.pt
output:
  partitions: /beegfs/home/mrashid/datasets/SAM_BPT
  explanations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/explanations
  evaluations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/evaluations

evaluation:
  bg-type: "full"
