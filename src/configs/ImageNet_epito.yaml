# Partition-generation configuration; no annotation file is required.
device: cuda
data:
  name: ImageNet
  input_format: directory
  image_dir: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/data/data_full/ImageNet/ImageNet/ILSVRC2012_img_val
  # Reference for downstream use; generation names its folder from CLI settings.
  mask_dir_final: ImageNet_sam2_large_254_compact-sam_100
  # Compact file read by XAI, previews and the audit: greedy (<id>_compact_greedy.npy), split, mso_0.5, ...
  compact_strategy: greedy
    
  # New SAM2 batch outputs; older partition directories are preserved.
  mask_dir_final_sam1: "ImageNet_sam1_vit_b_254_compact-sam_100"
  mask_dir_final_sam2: "ImageNet_sam2_large_254_compact-sam_100"
  
  ground_truth:
    format: imagenets
    root: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/data/data_full/ImageNet/ImageNetS
    # Same annotation subset used in notebooks/E1_E2_E3_E7.
    variant: 50
    # Optional: categories_file (ImageNetS synsets) and class_index_file (classifier index -> synset).

evaluation:
  methods: [BPT, compact]
  limit: 2
  bg-type: "full"
  max-evals: 500
  eval-batch-size: 2048
  auc-batch-size: 1024
  auc_num_samples: 101

  # Options:
  #   black   : black background
  #   gray    : gray background
  #   white   : white background
  #   blurred : blurred background
  #  noise

output:
  partitions: /beegfs/home/mrashid/datasets/SAM_BPT
  explanations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/explanations
  evaluations: /beegfs/home/mrashid/repos/XAI/Shap_BPT_SAM_tests/results/evaluations
